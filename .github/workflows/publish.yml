name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=false
          for i in 1 2 3 4 5 6 7 8; do
            # Cache-busting query: the registry edge caches packuments for
            # 5 minutes, which can hide a just-published version.
            if curl -sf "https://registry.npmjs.org/mbflash/$VERSION?t=$(date +%s%N)" >/dev/null; then
              PUBLISHED=true
              break
            fi
            sleep 2
          done
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        # Auth comes from the OIDC trusted publisher configured on npmjs.com;
        # no NPM_TOKEN secret is involved.
        run: npm publish --provenance
